[tool.poetry]
name = "bot-esoterico-telegram"
version = "3.0.0"
description = "Bot Telegram Esotéricas - Arquitetura Híbrida V3"
authors = ["Esotéricas Bot <bot@esotéricas.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.2"
openpyxl = "^3.1.2"
playwright = "^1.44.0"
gspread = "^6.1.2"
oauth2client = "^4.1.3"
cloudinary = "^1.40.0"
python-telegram-bot = {version = "^21.3", extras = ["webhooks"]}
python-dotenv = "^1.0.1"
pydantic-settings = "^2.3.4"
scikit-learn = "^1.5.0"
numpy = "^1.26.4"
httpx = "^0.27.0"
tenacity = "^8.4.1"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
black = "^24.4.2"
ruff = "^0.5.0"
mypy = "^1.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
