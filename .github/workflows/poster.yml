# Forçando atualização do workflow

name: 🌿 Bot Esotéricas – Poster Automático

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "30 11 * * *"
    - cron: "0 12 * * *"
    - cron: "30 12 * * *"
    - cron: "0 13 * * *"
    - cron: "30 13 * * *"
    - cron: "0 14 * * *"
    - cron: "30 14 * * *"
    - cron: "0 15 * * *"
    - cron: "30 15 * * *"
    - cron: "0 16 * * *"
    - cron: "30 16 * * *"
    - cron: "0 17 * * *"
    - cron: "30 17 * * *"
    - cron: "0 18 * * *"
    - cron: "30 18 * * *"
    - cron: "0 19 * * *"
    - cron: "30 19 * * *"
    - cron: "0 20 * * *"
    - cron: "30 20 * * *"
    - cron: "0 21 * * *"
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 22 * * *"
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      max_posts:
        description: "Número máximo de posts nesta execução"
        required: false
        default: "1"
        type: string

jobs:
  poster:
    name: Postar Produto Pendente
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Removido 'cache: "pip"' para evitar interferência

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Comando crucial: apenas instala dependências sem buildar o projeto
          poetry install --no-root

      - name: 🔑 Recriar arquivo de Service Account
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: 📁 Criar diretório de logs
        run: mkdir -p logs

      - name: 🚀 Executar Poster
        env:
          TELEGRAM_TOKEN:              ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_KEY:           ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          CLOUDINARY_URL:              ${{ secrets.CLOUDINARY_URL }}
          SHOPEE_APP_ID:               ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET_KEY:           ${{ secrets.SHOPEE_SECRET_KEY }}
          MAX_POSTS_PER_RUN:           ${{ github.event.inputs.max_posts || '1' }}
        run: |
          poetry run python main.py

      - name: 📋 Upload de logs (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-poster-${{ github.run_id }}
          path: logs/
          retention-days: 7
